
name: Build CallPilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \)

          GRADLEW=$(find . -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew found. Check that the Android project is committed to the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle wrapper in $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallPilot-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
