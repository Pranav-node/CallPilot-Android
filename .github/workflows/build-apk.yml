name: Build CallPilot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callpilot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CallPilot Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Step 1: Download the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Step 3: Install Android SDK tools
      # Explicitly request platform-tools to avoid the obsolete "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Step 4: Install the required Android SDK components
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Installed Android SDK components:"
          sdkmanager --list_installed

      # Step 5: Install Gradle 8.10.2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Step 6: Verify the Android project structure
      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts was not found in the repository root."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

          echo "Android project structure verified."

      # Step 7: Compile the Android application
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # Step 8: Verify the APK
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::The APK was not generated at the expected path."
            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK SHA-256 checksum:"
          sha256sum "$APK"

      # Step 9: Upload the APK for download
      - name: Upload CallPilot APK
        uses: actions/upload-artifact@v4
        with:
          name: CallPilot-Assistant-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
