
name: Build CallPilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q CallPilot-Phone-Cloud-Build.zip -d extracted

      - name: Locate Gradle project
        id: locate
        run: |
          echo "Searching extracted project..."
          find extracted -maxdepth 6 -type f \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

          GRADLEW=$(find extracted -type f \
            -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew found in ZIP. Check its contents."
            echo "ZIP contents:"
            unzip -l CallPilot-Phone-Cloud-Build.zip
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLEW"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallPilot-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
