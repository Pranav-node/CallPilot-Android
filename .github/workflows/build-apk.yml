
name: Build CallPilot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callpilot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract outer ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="CallPilot-Phone-Cloud-Build.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Outer ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          INNER_ZIP="$(find extracted -type f \
            -name 'CallPilot-Kotlin-MVP.zip' -print -quit)"

          if [ -z "$INNER_ZIP" ]; then
            echo "::error::Inner Android ZIP not found."
            find extracted -maxdepth 6 -type f -print
            exit 1
          fi

          mkdir -p android-project
          unzip -o "$INNER_ZIP" -d android-project

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find android-project -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            find android-project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Align Java and Kotlin JVM targets
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/callpilot-jvm-fix.gradle" <<'EOF'
          allprojects {
              tasks.withType(
                  org.gradle.api.tasks.compile.JavaCompile
              ).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(
                  org.jetbrains.kotlin.gradle.tasks.KotlinCompile
              ).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

          echo "Java and Kotlin compilation targets will use JVM 17."

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/callpilot-jvm-fix.gradle" \
            assembleDebug

      - name: Find and prepare APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK was not generated."
            find app/build -maxdepth 8 -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifacts/CallPilot-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/artifacts/CallPilot-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallPilot-debug-APK
          path: artifacts/CallPilot-debug.apk
          if-no-files-found: error
          retention-days: 14
